<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · delegated work</title>
<style>
:root{color-scheme:dark;--ink:#e5eee8;--muted:#9babA3;--line:#2d3933;--paper:#101613;--green:#9acbac}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}input{font:inherit}a,input{outline-offset:5px}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}header{background:#151f1a;padding:21px max(5vw,24px);border-bottom:1px solid var(--line)}.brand{margin:0;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;letter-spacing:.02em}.mark{width:23px;height:23px;display:grid;grid-template-columns:1fr 1fr;gap:3px}.mark i{background:#a8d8ba;border-radius:2px}.mark i:last-child{opacity:.4}.header-row{display:flex;justify-content:space-between;align-items:center;gap:24px}.generated{font-size:12px;color:#b5c7c4;text-align:right;white-space:nowrap}.generated strong{display:block;color:#d4e5e0;font-weight:450}main{max-width:1480px;margin:auto;padding:26px max(5vw,24px) 45px}.section-heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:19px}.section-heading h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.025em}.section-heading p{font-size:12px;color:var(--muted);margin:3px 0 0}.search{background:#19231d;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;padding:9px 13px;gap:8px;min-width:270px}.search svg{width:17px;height:17px;color:var(--muted)}.search input{border:0;min-width:0;outline-offset:2px;width:100%;background:transparent;color:var(--ink);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#19231d;border:1px solid var(--line);border-radius:12px;padding:23px;display:flex;flex-direction:column;box-shadow:0 3px 10px #152d2703;min-width:0;border-top:3px solid #3b4d41}.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:25px}.agent{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:650;overflow-wrap:anywhere}.assignment-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:#99ad9f;overflow-wrap:anywhere;margin-bottom:6px}.card h2{font-size:19px;line-height:1.3;letter-spacing:-.025em;margin:0 0 13px;font-weight:610;overflow-wrap:anywhere}.card h2 a span{color:#b0c7b7;font-size:15px}.mission{margin:0 0 22px;color:#b2c3b9;font-size:13px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.card footer{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #2b3c30;padding-top:14px;margin-top:auto;font-size:10px;color:#94a99b}.card time{color:#acbeb1;text-align:right}.empty{border:1px dashed #3d5144;border-radius:12px;padding:55px 24px;text-align:center;color:var(--muted);grid-column:1/-1}.empty h2{font-size:20px;color:var(--ink);margin:0 0 8px}.empty p{font-size:13px;margin:0}.empty code{display:block;margin-top:18px;font-size:12px;overflow-wrap:anywhere}.bottom{display:flex;justify-content:space-between;gap:15px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;color:#97ad9e}[hidden]{display:none!important}@media(min-width:1400px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.generated{display:none}}@media(max-width:620px){.grid{grid-template-columns:1fr}.section-heading{display:block}.search{margin-top:16px;min-width:0}.bottom{display:block}.card{padding:20px}}
</style></head><body>
<header><div class="header-row"><h1 class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>dashboard</h1><div class="generated">Page generated<strong><!-- generated --></strong></div></div></header>
<main>
<div class="section-heading"><div><h2>Assignments</h2></div><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="Search assignments" placeholder="Find an agent, task, or mission…"></label></div>
<section class="grid" aria-label="Assignments"><!-- cards --><div class="empty" id="empty" hidden><h2>No assignments yet.</h2><p>Add delegated work from any terminal or agent.</p><code>dashboard set ID --agent NAME --task TITLE --mission MISSION</code></div></section>
<div class="bottom"><span>Refreshes every minute · All times UTC</span></div></main>
<script>
const cards=[...document.querySelectorAll('.card')], search=document.querySelector('#search'), empty=document.querySelector('#empty');
function apply(){const term=search.value.toLowerCase();let visible=0;for(const card of cards){card.hidden=!card.textContent.toLowerCase().includes(term);if(!card.hidden)visible++;}empty.hidden=visible>0;if(cards.length){empty.querySelector('h2').textContent='No matching assignments.';empty.querySelector('p').textContent='Try another search.';empty.querySelector('code').hidden=true;}try{sessionStorage.setItem('dashboard:'+location.pathname,JSON.stringify({search:search.value}));}catch{}}
try{const state=JSON.parse(sessionStorage.getItem('dashboard:'+location.pathname)||'{}');search.value=state.search||'';}catch{}
search.addEventListener('input',apply);apply();setTimeout(()=>location.reload(),60000);
</script></body></html>
